<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="calculadora.css">
</head>
<body>
    <main>
        <h1>Calculadora</h1>
        <input id="n1" type="number" placeholder="Número 1" aria-label="Número 1">
        <input id="n2" type="number" placeholder="Número 2" aria-label="Número 2">

        <div class="botoes">
            <button id="somar" type="button">+</button>
            <button id="subtrair" type="button">-</button>
            <button id="multiplicar" type="button">*</button>
            <button id="dividir" type="button">/</button>
        </div>

        <p id="resultado" aria-live="polite">Resultado:</p>
    </main>

    <script src="calculadora.js"></script>
</body>
</html>
